<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ahmad · Statistician &amp; data scientist</title>
    <meta name="description" content="Ahmad. Statistician and data scientist. Finding structure in uncertainty.">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; connect-src 'none'">
    <link rel="stylesheet" href="styles.css?v=inference">
  </head>
  <body>
    <main>
      <section class="screen warm motion" id="warm">
        <nav class="nav" aria-label="Editorial identity">
          <span class="wordmark">Ahmad.</span>
          <div class="nav-right">
            <span class="nav-detail" data-copy="detail">Curiosity, always.</span>
            <div class="language" hidden role="group" aria-label="Choose language">
              <button type="button" data-language="en" lang="en" aria-pressed="true">English</button>
              <button type="button" data-language="fi" lang="fi" aria-pressed="false">Suomi</button>
            </div>
          </div>
        </nav>
        <div class="hero">
          <div class="intro">
            <h1>
              <span data-copy="greeting">Hello.</span>
              <em data-copy="name">I'm Ahmad.</em>
            </h1>
            <p class="lead" data-copy="lead">Finding structure in uncertainty.</p>
            <p class="profession" data-copy="profession">Statistician · Data scientist</p>
            <a class="contact-link" href="https://www.linkedin.com/in/ahmadmukhtaar/" target="_blank" rel="noopener noreferrer">
              <span data-copy="contact">Connect on LinkedIn</span> <span class="arrow" aria-hidden="true">↗</span>
            </a>
            <figure class="inference" hidden>
              <figcaption class="inference-heading">
                <span data-copy="inferenceTitle">Evidence &amp; uncertainty</span>
                <span class="inference-legend" aria-hidden="true">
                  <span class="prior-label" data-copy="prior">Prior</span>
                  <span class="posterior-label" data-copy="posterior">Updated</span>
                </span>
              </figcaption>
              <svg class="inference-plot" viewBox="0 0 400 105" role="img" aria-labelledby="inference-description">
                <title id="inference-description">An illustrative Bayesian update of a normal mean.</title>
                <path class="plot-axis" d="M12 84H388"/>
                <path class="posterior-area"/>
                <path class="prior-curve"/>
                <path class="posterior-curve"/>
                <text x="12" y="101">−3</text>
                <text x="200" y="101" text-anchor="middle">0</text>
                <text x="388" y="101" text-anchor="end">3</text>
              </svg>
              <div class="evidence-control">
                <label for="evidence" data-copy="evidence">Evidence</label>
                <input id="evidence" type="range" min="0" max="12" value="3" step="1" aria-describedby="inference-summary">
                <output for="evidence" id="evidence-count">3</output>
              </div>
              <p class="inference-summary" id="inference-summary" data-copy="inferenceHint">Move the slider. Watch uncertainty change.</p>
              <p class="stat-note" aria-label="Bayes’ rule: posterior density is proportional to likelihood times prior density"><i>p</i>(<i>θ</i> | <i>x</i>) ∝ <i>p</i>(<i>x</i> | <i>θ</i>)<i>p</i>(<i>θ</i>)</p>
            </figure>
          </div>
        <figure class="portrait">
          <div class="portrait-stage">
            <svg class="strokes" viewBox="0 0 450 550" aria-hidden="true">
              <defs>
                <mask id="portrait-clearance">
                  <rect width="450" height="550" fill="white"/>
                  <ellipse cx="230" cy="280" rx="145" ry="230" fill="black"/>
                </mask>
              </defs>
              <g mask="url(#portrait-clearance)" transform="rotate(-24 225 275)">
                <ellipse cx="225" cy="275" rx="212" ry="202"/>
                <ellipse cx="225" cy="275" rx="185" ry="176"/>
                <ellipse cx="225" cy="275" rx="158" ry="150"/>
                <circle cx="411" cy="193" r="2"/>
                <circle cx="53" cy="349" r="2"/>
              </g>
            </svg>
            <img class="sketch" src="portrait-sketch.png?v=watermarked" alt="Pencil portrait of Ahmad" width="1098" height="1433" draggable="false">
          </div>
        </figure>
      </div>
      <footer class="bottom">
        <blockquote class="quote">
          <p>“Look within; within is the fountain of all good.”</p>
          <a href="https://m.gutenberg.org/files/2680/2680-h/2680-h.htm" target="_blank" rel="noopener noreferrer">Marcus Aurelius · Meditations ↗</a>
        </blockquote>
        <button class="replay" id="replay">Replay introduction ↻</button>
      </footer>
    </section>
  </main>
  <script src="site.js?v=inference" defer>
  </script>
</body>
</html>
